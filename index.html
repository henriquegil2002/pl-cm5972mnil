<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23155E4F'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='white' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='7' fill='white'/%3E%3C/svg%3E">
<title>Plate Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one phone-width column; a nutrition-label panel up top, meals below, bottom tab bar. */
:root {
  --bg: #EEF1EC; --surface: #FFFFFF; --ink: #18201D; --muted: #5D6A64; --line: #CDD5CF; --track: #E2E7E3;
  --accent: #155E4F; --accent-ink: #FFFFFF; --accent-soft: #D7E8E2;
  --protein: #2D55C8; --carbs: #B87D0E; --fat: #B23F72; --fiber: #4F7A2A; --warn: #B4441B; --ok: #2E7D4F; --natural: #8E9CC0;
  --display: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1412; --surface: #182019; --ink: #E7EDE9; --muted: #98A49E; --line: #2B3531; --track: #27302C;
  --accent: #62C4A8; --accent-ink: #0B1411; --accent-soft: #1D3A33;
  --protein: #86A3FF; --carbs: #E8B54A; --fat: #E683B0; --fiber: #9FC86E; --warn: #F0905F; --ok: #6FCB93; --natural: #7E8DB8;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1412; --surface: #182019; --ink: #E7EDE9; --muted: #98A49E; --line: #2B3531; --track: #27302C;
  --accent: #62C4A8; --accent-ink: #0B1411; --accent-soft: #1D3A33;
  --protein: #86A3FF; --carbs: #E8B54A; --fat: #E683B0; --fiber: #9FC86E; --warn: #F0905F; --ok: #6FCB93; --natural: #7E8DB8;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 110px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; font-weight: 800; font-stretch: 80%; letter-spacing: -0.01em; line-height: 1.1; }
h2 { font-size: 1.15rem; font-weight: 800; font-stretch: 85%; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn { border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: transparent; color: var(--warn); border: 1.5px solid var(--warn); }
.btn.wide { width: 100%; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 1.2rem; line-height: 1; }
.iconbtn:disabled { opacity: 0.35; cursor: default; }

/* Day header */
.dayhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dayhead > div { text-align: center; min-width: 0; }

/* Nutrition-label panel */
.label { background: var(--surface); border: 2px solid var(--ink); padding: 10px 14px 14px; }
.label-title { font-family: var(--display); font-weight: 900; font-stretch: 70%; font-size: 2rem; line-height: 1; letter-spacing: -0.01em; }
.rule { height: 1px; background: var(--ink); margin: 6px 0; }
.rule.thick { height: 8px; }
.rule.mid { height: 4px; }
.kcal-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.kcal-row .big { font-family: var(--display); font-weight: 900; font-size: 2.6rem; line-height: 1; font-stretch: 80%; }
.kcal-row .of { color: var(--muted); font-weight: 600; }
.mrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.mrow:last-of-type { border-bottom: 0; }
.mrow b { font-weight: 800; }
.mrow .pct { font-weight: 800; font-family: var(--display); }
.bar { grid-column: 1 / -1; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.sugar { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
.sbar-wrap { position: relative; padding-bottom: 14px; }
.sbar { display: flex; height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
.sbar > i { display: block; height: 100%; }
.sbar .unk { background: repeating-linear-gradient(45deg, var(--natural) 0 3px, var(--track) 3px 6px); }
.stick { position: absolute; top: -2px; height: 14px; width: 2px; background: var(--ink); opacity: .55; transform: translateX(-1px); }
.stick span { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-size: .66rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.slegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--muted); }
.slegend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.spill { font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; color: var(--surface); }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--accent)); max-width: 100%; }
.togo { margin: 10px 0 0; font-size: 0.9rem; color: var(--muted); }
.togo strong { color: var(--ink); }
.default-note { font-size: 0.85rem; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
.default-note button { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; }

/* Meals */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.meals { display: flex; flex-direction: column; gap: 8px; }
.meal { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: left; width: 100%; }
.meal .thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--track); display: grid; place-items: center; font-family: var(--display); font-weight: 800; color: var(--muted); font-size: 0.8rem; }
.meal .mid { min-width: 0; }
.meal .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meal .meta { font-size: 0.8rem; color: var(--muted); }
.meal .kc { font-family: var(--display); font-weight: 800; font-size: 1.1rem; text-align: right; }
.macros { display: flex; gap: 8px; font-size: 0.8rem; flex-wrap: wrap; }
.macros span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: var(--c); margin-right: 4px; vertical-align: 1px; }
.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); text-align: center; }

/* Review */
.review { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.review h3 { font-size: 1rem; font-weight: 800; font-stretch: 85%; margin: 12px 0 4px; }
.review h3:first-child { margin-top: 0; }
.review p { margin: 4px 0; }
.review ul { margin: 4px 0; padding-left: 20px; }
.review li { margin: 3px 0; }
.review .stamp { font-size: 0.75rem; color: var(--muted); margin-top: 10px; }
.thinking { color: var(--muted); font-style: italic; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.err { color: var(--warn); font-size: 0.9rem; }

/* Bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; z-index: 5; }
.tabs button { background: none; border: 0; padding: 8px 4px; border-radius: 10px; font-weight: 600; font-size: 0.8rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tabs .log { color: var(--accent-ink); background: var(--accent); }

/* Editor sheet */
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 10; overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .wrap { padding-block: 12px 40px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px dashed var(--line); border-radius: 12px; padding: 20px; text-align: center; background: var(--surface); cursor: pointer; }
.drop strong { font-family: var(--display); font-size: 1.05rem; }
.drop span { font-size: 0.85rem; color: var(--muted); }
.pickrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.pick { position: relative; overflow: hidden; }
.pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; }
.pick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.previews { display: flex; gap: 8px; flex-wrap: wrap; }
.previews figure { position: relative; margin: 0; }
.previews img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; display: block; }
.previews button { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); font-weight: 700; line-height: 1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
input[type=text], input[type=number], input[type=time], select, textarea { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 10px; min-width: 0; }
textarea { resize: vertical; min-height: 72px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.item-top { display: flex; gap: 8px; align-items: center; }
.item-top input { flex: 1; font-weight: 600; }
.item-top button { flex: none; width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: none; color: var(--muted); }
.nutr { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.nutr label { display: flex; flex-direction: column; gap: 2px; font-size: 0.7rem; font-weight: 700; color: var(--muted); min-width: 0; }
.nutr label i { font-style: normal; display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: var(--c); margin-right: 3px; }
.nutr input { padding: 7px 5px; text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 99px; background: var(--track); }
.pill.high { background: var(--ok); color: var(--surface); }
.pill.low { background: var(--warn); color: var(--surface); }
.src { font-size: 0.72rem; color: var(--muted); }
.assume { font-size: 0.88rem; color: var(--muted); margin: 6px 0 0; }
.sumline { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 700; padding: 10px 0; border-top: 4px solid var(--ink); }
.status { font-size: 0.9rem; color: var(--muted); }

/* Week */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stat .v { font-family: var(--display); font-weight: 900; font-stretch: 80%; font-size: 1.8rem; line-height: 1.1; }
.stat .k { font-size: 0.8rem; color: var(--muted); }
.wk { display: flex; flex-direction: column; gap: 6px; }
.wkrow { display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; }
.wkrow .d { grid-row: span 2; font-family: var(--display); font-weight: 800; line-height: 1.15; }
.wkrow .d small { display: block; font-family: var(--body); font-weight: 500; color: var(--muted); font-size: 0.75rem; }
.wkline { display: grid; grid-template-columns: 1fr 92px; gap: 8px; align-items: center; font-size: 0.8rem; }
.wkline .bar { grid-column: auto; }
.wkline span { text-align: right; }

/* Targets */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.hint { font-size: 0.85rem; color: var(--muted); margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 99px; font-weight: 600; font-size: 0.9rem; z-index: 20; }
.notice { background: var(--surface); border: 1.5px solid var(--warn); border-radius: 12px; padding: 14px; }

@media (max-width: 380px) { .nutr { grid-template-columns: repeat(3, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .4s ease; } }
.keyrow { display: flex; gap: 8px; }
.keyrow input { flex: 1; }
.okline { color: var(--ok); font-size: 0.9rem; font-weight: 600; }
.setup { background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.setup p { margin: 0; }
</style>
</head>
<body>
<div id="main" class="wrap" aria-live="polite"></div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script type="module">
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const r0 = n => Math.round(Number(n) || 0);
const r1 = n => Math.round((Number(n) || 0) * 10) / 10;
const fmt = n => r0(n).toLocaleString('en-US');
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const MODEL = 'claude-sonnet-5-5';
const SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm';
const DATA_KEY = 'plate-ledger-v1';
const API_KEY = 'plate-ledger-apikey';

const NUTRS = ['kcal', 'protein', 'carbs', 'fat', 'fiber', 'sugar', 'added_sugar', 'sodium'];
const DEFAULT_TARGETS = { kcal: 2700, protein: 150, carbs: 340, fat: 80, fiber: 35, added_sugar: 25 };
// WHO: free (added) sugars ideally under 5% of energy, about 25 g a day; the firm limit is 10%.
const SUGAR_LIMIT = 25;
const MACROS = [
  { k: 'protein', label: 'Protein', c: 'var(--protein)' },
  { k: 'carbs', label: 'Carbohydrate', c: 'var(--carbs)' },
  { k: 'fat', label: 'Fat', c: 'var(--fat)' },
  { k: 'fiber', label: 'Fiber', c: 'var(--fiber)' },
];
const ACTIVITY = [
  { v: 1.2, t: 'Desk job, little exercise' },
  { v: 1.375, t: 'Training 1–3 days a week' },
  { v: 1.55, t: 'Training 3–5 days a week' },
  { v: 1.725, t: 'Training 6–7 days a week' },
  { v: 1.9, t: 'Hard training + physical job' },
];
const MEAL_TYPES = ['Breakfast', 'Lunch', 'Dinner', 'Snack', 'Pre-workout', 'Post-workout'];

/* ---------- local storage ---------- */
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }
function loadData() {
  try { const d = JSON.parse(lsGet(DATA_KEY) || 'null'); if (d && typeof d === 'object') return { days: d.days || {}, profile: d.profile || null }; } catch {}
  return { days: {}, profile: null };
}
function persist() {
  const ok = lsSet(DATA_KEY, JSON.stringify({ days: S.days, profile: S.profile }));
  if (!ok) toast('Couldn’t save on this phone. Storage may be full: export a backup and delete old days.');
  return ok;
}

function sumItems(items) {
  const t = {}; NUTRS.forEach(k => t[k] = 0);
  (items || []).forEach(it => NUTRS.forEach(k => t[k] += Number(it[k]) || 0));
  return t;
}
const dayTotals = day => sumItems((day?.meals || []).flatMap(m => m.items || []));
const targets = () => ({ added_sugar: SUGAR_LIMIT, ...(S.profile?.targets || DEFAULT_TARGETS) });
const typeForHour = h => h < 11 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 18 ? 'Snack' : 'Dinner';
const hasKey = () => !!(lsGet(API_KEY) || '').trim();

const stored = loadData();
const S = {
  days: stored.days, profile: stored.profile,
  view: 'today', date: todayKey(),
  ed: null, formDirty: false,
  review: { busy: false, date: null, text: '', err: '', ctl: null },
};

/* ---------- Claude API ---------- */
let SDK = null, client = null, clientKey = null;
async function getClient() {
  const key = (lsGet(API_KEY) || '').trim();
  if (!key) throw { code: 'no_key' };
  if (!SDK) {
    try { SDK = (await import(SDK_URL)).default; }
    catch { throw { code: 'sdk_load' }; }
  }
  if (!client || clientKey !== key) {
    client = new SDK({ apiKey: key, dangerouslyAllowBrowser: true, maxRetries: 2 });
    clientKey = key;
  }
  return client;
}
const BASE_PARAMS = {
  model: MODEL,
  betas: ['server-side-fallback-2026-07-01'],
  fallbacks: 'default',
};

function apiErrCopy(e) {
  if (e?.code === 'no_key') return 'Add your Claude API key in Settings first.';
  if (e?.code === 'sdk_load') return 'Couldn’t load the Claude library. Check your internet connection.';
  if (e?.code === 'refused') return 'Claude declined to analyze this. Try a different photo or note.';
  if (e?.code === 'bad_json') return 'The estimate came back garbled. Tap Estimate again.';
  if (e?.code === 'cancelled' || e?.name === 'AbortError' || (SDK && e instanceof SDK.APIUserAbortError)) return '';
  if (SDK) {
    if (e instanceof SDK.AuthenticationError) return 'Your API key was rejected. Check it in Settings.';
    if (e instanceof SDK.PermissionDeniedError) return 'This API key isn’t allowed to use Claude. Check it in the Claude Console.';
    if (e instanceof SDK.RateLimitError) return 'Too many requests right now. Wait a minute and try again.';
    if (e instanceof SDK.BadRequestError) {
      const msg = String(e?.error?.error?.message || e?.message || '');
      if (/credit/i.test(msg)) return 'Your Claude API account is out of credit. Add credit in the Claude Console (Billing).';
      return 'Claude couldn’t process this request: ' + msg.slice(0, 160);
    }
    if (e instanceof SDK.APIConnectionError) return 'No connection to Claude. Check your internet and try again.';
    if (e instanceof SDK.APIError) return 'Claude is busy or had an error (' + (e.status || '?') + '). Try again in a moment.';
  }
  return 'Something went wrong reaching Claude. Try again.';
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}

const ITEM_SCHEMA = {

// Tools Claude can use while estimating. The two client tools run here in the page; the web tools run on Anthropic's side.
const CLIENT_TOOLS = [
  {
    name: 'search_food_log',
    description: 'Search the user\'s own food log in this app. Use it whenever the user refers to something they ate before ("same yogurt as yesterday", "the usual breakfast", "like Monday\'s lunch"). Returns matching past meals with every item\'s grams and macros, newest first. Search by food words (try Portuguese and English spellings, e.g. "iogurte" and "yogurt"), by date, or both. With only a date, returns every meal from that day.',
    strict: true,
    input_schema: {
      type: 'object',
      additionalProperties: false,
      required: ['query', 'date', 'days_back'],
      properties: {
        query: { type: ['string', 'null'], description: 'Food words to look for in meal names, notes and items. Null to list by date only.' },
        date: { type: ['string', 'null'], description: 'A single day, YYYY-MM-DD. Null to search a range.' },
        days_back: { type: ['integer', 'null'], description: 'When date is null: how many days back from today to search (default 30, max 120).' },
      },
    },
  },
  {
    name: 'submit_estimate',
    description: 'Submit the final nutrition estimate for this meal. Call it exactly once, as your last step, after any lookups.',
    strict: true,
    input_schema: MEAL_SCHEMA,
  },
];
const WEB_TOOLS = [
  { type: 'web_search_20260209', name: 'web_search', max_uses: 3, user_location: { type: 'approximate', country: 'PT', timezone: 'Europe/Lisbon' } },
  { type: 'web_fetch_20260209', name: 'web_fetch', max_uses: 3, max_content_tokens: 20000 },
];

const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function searchFoodLog(input) {
  const today = todayKey();
  const q = fold(input?.query || '').split(/[^a-z0-9]+/).filter(w => w.length >= 3);
  const date = /^\d{4}-\d{2}-\d{2}$/.test(input?.date || '') ? input.date : null;
  const back = Math.min(120, Math.max(1, Number(input?.days_back) || 30));
  const from = addDays(today, -back);
  const hits = [];
  for (const [k, day] of Object.entries(S.days)) {
    if (date ? k !== date : (k < from || k > today)) continue;
    for (const m of day?.meals || []) {
      const hay = fold([m.name, m.note, ...(m.items || []).map(i => i.name)].join(' '));
      // A word matches if either side starts with the other's first 5 letters ("iogurt" ~ "iogurte").
      const score = q.length ? q.filter(w => hay.includes(w) || hay.includes(w.slice(0, 5))).length : 1;
      if (score) hits.push({ score, k, m });
    }
  }
  hits.sort((a, b) => b.score - a.score || b.k.localeCompare(a.k) || (b.m.time || '').localeCompare(a.m.time || ''));
  const meals = hits.slice(0, 15).map(({ k, m }) => ({
    date: k, time: m.time, meal: m.type, name: m.name, note: m.note || '',
    items: (m.items || []).map(i => ({ name: i.name, grams: i.grams, kcal: i.kcal, protein: i.protein, carbs: i.carbs, fat: i.fat, fiber: i.fiber, sugar: i.sugar, added_sugar: i.added_sugar ?? null, sodium: i.sodium })),
  }));
  return meals.length ? { today, meals } : { today, meals: [], note: 'No matching meals. Try other words (Portuguese/English), a date, or a longer range.' };
}

const isWebToolRejection = e => SDK && e instanceof SDK.BadRequestError && /web[_ ]?(search|fetch)/i.test(String(e?.error?.error?.message || e?.message || ''));
let webToolsOff = false;

async function askMeal(prompt, files, signal, onStatus = () => {}) {
  const c = await getClient();
  const content = [];
  for (const f of files) {
    const mt = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(f.type) ? f.type : 'image/jpeg';
    content.push({ type: 'image', source: { type: 'base64', media_type: mt, data: await blobToBase64(f) } });
  }
  content.push({ type: 'text', text: prompt });

  const run = async (withWeb) => {
    const messages = [{ role: 'user', content }];
    const tools = withWeb ? [...CLIENT_TOOLS, ...WEB_TOOLS] : CLIENT_TOOLS;
    for (let round = 0; round < 8; round++) {
      const resp = await c.beta.messages.create({
        ...BASE_PARAMS, max_tokens: 16000, output_config: { effort: 'medium' }, tools, messages,
      }, { signal });
      if (resp.stop_reason === 'refusal') throw { code: 'refused' };
      const blocks = resp.content;
      const submit = blocks.find(b => b.type === 'tool_use' && b.name === 'submit_estimate');
      if (submit) return submit.input;
      if (blocks.some(b => b.type === 'server_tool_use')) onStatus('Checking the web…');
      if (resp.stop_reason === 'pause_turn') { messages.push({ role: 'assistant', content: blocks }); continue; }
      const calls = blocks.filter(b => b.type === 'tool_use');
      if (resp.stop_reason === 'tool_use' && calls.length) {
        messages.push({ role: 'assistant', content: blocks });
        const results = calls.map(t => {
          if (t.name === 'search_food_log') {
            onStatus('Checking your past meals…');
            return { type: 'tool_result', tool_use_id: t.id, content: JSON.stringify(searchFoodLog(t.input)) };
          }
          return { type: 'tool_result', tool_use_id: t.id, content: 'Unknown tool.', is_error: true };
        });
        messages.push({ role: 'user', content: results });
        onStatus('Working out the macros…');
        continue;
      }
      // Ended without submitting: accept JSON written as text, otherwise ask once for the submission.
      const text = blocks.filter(b => b.type === 'text').map(b => b.text).join('');
      const s = text.indexOf('{'), e = text.lastIndexOf('}');
      if (s >= 0 && e > s) { try { const j = JSON.parse(text.slice(s, e + 1)); if (Array.isArray(j.items)) return j; } catch {} }
      messages.push({ role: 'assistant', content: blocks }, { role: 'user', content: 'Please call submit_estimate with your estimate now.' });
    }
    throw { code: 'bad_json' };
  };

  if (!webToolsOff) {
    try { return await run(true); }
    catch (e) {
      if (!isWebToolRejection(e)) throw e;
      webToolsOff = true; // web search is switched off for this API account; carry on without it
    }
  }
  return run(false);
}

async function askReview(prompt, onText, signal) {
  const c = await getClient();
  const stream = c.beta.messages.stream({
    ...BASE_PARAMS,
    max_tokens: 16000,
    output_config: { effort: 'medium' },
    messages: [{ role: 'user', content: prompt }],
  }, { signal });
  let text = '';
  stream.on('text', delta => { text += delta; onText(text); });
  const msg = await stream.finalMessage();
  if (msg.stop_reason === 'refusal') throw { code: 'refused' };
  return msg.content.filter(b => b.type === 'text').map(b => b.text).join('') || text;
}

function dayLabel(k) {
  const d = fromKey(k), t = todayKey();
  const rel = k === t ? 'Today' : k === addDays(t, -1) ? 'Yesterday' : d.toLocaleDateString('en-GB', { weekday: 'long' });
  return { rel, full: d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) };
}

function barHTML(val, target, color) {
  const pct = target ? Math.min(100, (val / target) * 100) : 0;
  return `<div class="bar"><i style="--c:${color};width:${pct.toFixed(1)}%"></i></div>`;
}

// One sugar bar: added sugar first (colored by WHO range), natural sugar after it in a fixed color.
// WHO: added ("free") sugar ideally ≤ 25 g/day; the firm maximum is 10% of energy, about 50 g.
function sugarRowHTML(day, tot, limit) {
  let added = 0, natural = 0, unknown = 0, untracked = 0;
  for (const m of day?.meals || []) {
    let old = false;
    for (const i of m.items || []) {
      const s = Number(i.sugar) || 0;
      if (i.added_sugar === undefined) { unknown += s; old = true; continue; }
      const a = Math.min(s || Infinity, Number(i.added_sugar) || 0);
      added += a; natural += Math.max(0, s - a);
    }
    if (old) untracked++;
  }
  const ideal = limit || SUGAR_LIMIT, max = ideal * 2;
  const total = added + natural + unknown;
  const level = added > max ? { c: 'var(--warn)', t: 'Too much added sugar' }
    : added > ideal ? { c: 'var(--carbs)', t: 'Above the ideal' }
    : { c: 'var(--ok)', t: 'Healthy' };
  const scale = Math.max(90, total, max) * 1.05;
  const w = g => (g / scale * 100).toFixed(2) + '%';
  const tick = (g, label) => `<div class="stick" style="left:${w(g)}"><span>${label}</span></div>`;
  return `<div class="mrow">
    <div><b>Sugars</b> <span class="num">${fmt(total)} g</span></div>
    <div><span class="spill" style="background:${level.c}">${level.t}</span></div>
    <div class="sugar">
      <div class="sbar-wrap">
        <div class="sbar" role="img" aria-label="${fmt(added)} g added sugar, ${fmt(natural)} g natural sugar${unknown ? `, ${fmt(unknown)} g not split` : ''}">
          <i style="width:${w(added)};background:${level.c}"></i><i style="width:${w(natural)};background:var(--natural)"></i>${unknown ? `<i class="unk" style="width:${w(unknown)}"></i>` : ''}
        </div>
        ${tick(ideal, `${fmt(ideal)} g ideal`)}${tick(max, `${fmt(max)} g max`)}
      </div>
      <div class="slegend num">
        <span><i style="background:${level.c}"></i>Added ${fmt(added)} g of ${fmt(ideal)} g</span>
        <span><i style="background:var(--natural)"></i>Natural ${fmt(natural)} g</span>
        ${unknown ? `<span><i class="unk" style="background:repeating-linear-gradient(45deg, var(--natural) 0 3px, var(--track) 3px 6px)"></i>Not split ${fmt(unknown)} g (${untracked} older meal${untracked === 1 ? '' : 's'})</span>` : ''}
      </div>
    </div>
  </div>`;
}

function mdToHTML(text) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  let html = '', inList = false;
  for (const raw of String(text).split('\n')) {
    const line = raw.trim();
    const li = /^[-*•]\s+/.test(line);
    if (inList && !li) { html += '</ul>'; inList = false; }
    if (!line) continue;
    if (/^#{1,4}\s/.test(line)) html += `<h3>${inline(line.replace(/^#+\s*/, ''))}</h3>`;
    else if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(line.replace(/^[-*•]\s+/, ''))}</li>`; }
    else html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}

  const err = R.err && R.date === S.date ? `<p class="err">${esc(R.err)}</p>` : '';

  const stats = `<div class="stats">

  return `<header><div class="eyebrow">Last 7 days</div><h1>Your week</h1></header>

function srcLabel(it) {
  if (it.source === 'label') return 'From the label';
  if (it.source === 'manual') return 'Entered by you';
  if (it.source === 'history') return 'From your past meals';
  if (it.source === 'web') {
    let host = '';
    try { host = new URL(it.source_url).hostname.replace(/^www\./, ''); } catch {}
    return host ? `From the web: <a href="${esc(it.source_url)}" target="_blank" rel="noopener noreferrer">${esc(host)}</a>` : 'From the web';
  }
  return 'Estimated from photo/note';
}
function withBase(it) {
  const o = { name: it.name || '', grams: r0(it.grams), source: it.source || 'estimate' };
  if (it.source_url && /^https?:\/\//.test(it.source_url)) o.source_url = String(it.source_url);
  // Keep added_sugar missing on old items, so they still read as "not tracked" instead of 0 g.
  NUTRS.forEach(k => { if (!(k === 'added_sugar' && it[k] === undefined)) o[k] = r1(it[k]); });
  o.base = { grams: o.grams || 0 }; NUTRS.forEach(k => { if (o[k] !== undefined) o.base[k] = o[k]; });
  return o;
}

// Re-encode any phone photo (HEIC, huge JPEG) as a ≤1568px JPEG: smaller upload, always a format Claude reads.
async function toJpeg(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch {
    try {
      src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
    } catch { return file; }
  }
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
  if (!w0 || !h0) return file;
  const s = Math.min(1, 1568 / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  return blob || file;
}

async function makeThumb(file) {
  try {
    const bmp = await createImageBitmap(file);
    const s = 160 / Math.min(bmp.width, bmp.height);
    const c = document.createElement('canvas'); c.width = c.height = 160;
    const w = bmp.width * s, h = bmp.height * s;
    c.getContext('2d').drawImage(bmp, (160 - w) / 2, (160 - h) / 2, w, h);
    return c.toDataURL('image/jpeg', 0.7);
  } catch { return null; }
}

function mealPrompt(note, nPhotos) {
  const p = S.profile;
  return `You are a sports nutritionist filling in a food log for someone who is trying to build muscle${p?.weight ? ` (${p.weight} kg)` : ''}.
${nPhotos ? `Look carefully at the ${nPhotos} attached photo(s). They may show a plate of food, a packaged product, and/or a nutrition label; read any label text in them, even if small, curved or light-on-dark.` : 'There are no photos; work from the note alone.'}

User's note: ${note ? `"${note}"` : '(none)'}

Today is ${todayKey()} (${new Date().toLocaleDateString('en-GB', { weekday: 'long' })}). The user lives in Portugal.

Lookups (use only when they help):
- Past meals: if the note refers to something eaten before ("same yogurt as yesterday", "the usual", "like Monday's lunch"), call search_food_log and reuse those items' values, scaled to today's amount. Mark them source "history". If a search finds nothing, try other spellings (Portuguese/English) or search by date before falling back to an estimate.
- Restaurants, chains and branded products: if the meal is a named item from a restaurant or brand (e.g. "CBO menu McDonald's", "Pastelaria Versailles croissant", a specific supermarket product with no label in the photo), use web_search to find its official nutrition information, preferring the brand's own Portuguese website or its nutrition PDF, and web_fetch to open that page if the search snippets lack the numbers. Mark those items source "web" and set source_url to the page used. For a "menu"/meal deal, add each part (burger, fries size, drink) as its own item; if the size or drink is not stated, assume the standard medium menu with the most common drink and say so in assumptions.
- Do not search the web for generic foods (rice, chicken breast, banana) or when a readable label is in the photo.

Rules:
- Labels are often in Portuguese (Portugal or Brazil) or English: "Valor energético" (use the kcal figure, never kJ), "Lípidos" = fat, "dos quais saturados" = saturates, "Hidratos de carbono" = carbs, "dos quais açúcares" = sugar, "Fibra" = fiber, "Proteínas" = protein, "Carboidratos" = carbs, "Gorduras totais" = fat, "Sódio" = sodium, "Sal" = salt (sodium mg = salt g × 400). Values are usually "por 100 g" / "por 100 ml" and/or "por porção" (Brazilian labels list the portion size and "%VD"); work out which column is which.
- If label values are available, use them and scale to the amount eaten: from the note; else the portion printed on the label; else the package's net weight (peso líquido) if it is a single-serve item. Mark those items source "label".
- Otherwise estimate portions in grams from visual cues (standard plate about 26 cm, cutlery, hands, packaging) or the note, and use standard food composition data. Mark them source "estimate".
- Split a meal into its separate foods. Include likely hidden calories (cooking oil, butter, dressings, sauces, sugar in drinks) as their own items when they are probably there.
- added_sugar = WHO "free sugars" in the item: sugar added by the manufacturer, cook or eater, plus sugar in honey, syrups, fruit juice and juice concentrates. It does not include sugar naturally in whole fruit, vegetables, or plain milk and plain yogurt (lactose). It is part of "sugar", never more than it. Labels only give total sugars, so use the ingredients and product type: e.g. plain yogurt ≈ 0; a sweetened or fruit yogurt ≈ total sugar minus about 4.5 g per 100 g of lactose; soft drinks, sweets and pastries ≈ all of their sugar; a banana = 0.
- grams = amount eaten. kcal in kcal; protein, carbs, fat, fiber, sugar, added_sugar in grams; sodium in milligrams. Round to whole numbers except values under 10, which get one decimal.
- If there is nothing identifiable as food, return an empty items list and explain in assumptions.

Confidence, judged on the final numbers:
- "high": nutrition values come from a readable label (or are standard values for a simple food) AND the amount eaten is known (stated in the note, a printed portion, or a single-serve pack).
- "medium": label values are clear but the amount eaten was assumed, or a common dish with a clearly visible or described portion.
- "low": key values (kcal or protein) had to be guessed, or portion sizes are a rough guess.

- "high" also applies to values taken from the user's own history or an official brand nutrition page, when the amount is known.

meal_name: a short descriptive name. assumptions: one or two short sentences on what you assumed and where the numbers came from, and if confidence is not high, the one thing the user could add to raise it (e.g. "Add how many grams you ate").

When done, call submit_estimate once with the result. Use source_url null unless source is "web".`;
}

async function analyze() {
  const ed = S.ed;
  if (!ed) return;
  ed.note = $('#ed-note').value.trim();
  if (!ed.files.length && !ed.note) { ed.status = 'Take a photo or describe what you ate first.'; renderSheet(); return; }
  if (!hasKey()) { ed.status = 'Add your Claude API key in Settings first.'; renderSheet(); return; }
  ed.busy = true; ed.status = 'Looking at your food… usually 10–40 seconds.'; renderSheet();
  ed.ctl = new AbortController();
  try {
    const files = ed.files.slice(0, MAX_PHOTOS);
    const r = await askMeal(mealPrompt(ed.note, files.length), files, ed.ctl.signal, s => {
      if (S.ed !== ed) return;
      ed.status = s; const el = $('#ed-status'); if (el) el.textContent = s;
    });
    if (S.ed !== ed) return;
    const items = Array.isArray(r?.items) ? r.items : [];
    ed.items = items.filter(i => i && typeof i === 'object').map(withBase);
    ed.name = String(r?.meal_name || ed.name || '').slice(0, 80);
    ed.confidence = ['high', 'medium', 'low'].includes(r?.confidence) ? r.confidence : '';
    ed.assumptions = String(r?.assumptions || '').slice(0, 400);
    ed.status = ed.items.length ? 'Check the numbers, adjust grams if needed, then save.' : 'No food found. Try another photo or add a note.';
  } catch (e) {
    if (S.ed !== ed) return;
    ed.status = apiErrCopy(e);
  }
  ed.busy = false; ed.ctl = null;
  renderSheet();
}

  const ed = S.ed; if (!ed) return;

  const idx = day.meals.findIndex(m => m.id === meal.id);

async function runReview() {
  const dateKey = S.date;
  const day = S.days[dateKey];
  if (!day?.meals?.length || S.review.busy) return;
  if (!hasKey()) { S.review = { busy: false, date: dateKey, text: '', err: 'Add your Claude API key in Settings first.', ctl: null }; render(); return; }
  const ctl = new AbortController();
  S.review = { busy: true, date: dateKey, text: '', err: '', ctl };

  try {
    const text = await askReview(reviewPrompt(dateKey), t => {
      S.review.text = t;
      const b = $('#review-body'); if (b && S.date === dateKey && S.view === 'today') b.innerHTML = mdToHTML(t);
    }, ctl.signal);
    S.days[dateKey] = { ...S.days[dateKey], review: { text, at: new Date().toISOString(), meals: day.meals.length } };

  } catch (e) {
    S.review.err = apiErrCopy(e);
  }
  S.review.busy = false; S.review.ctl = null;

/* ---------- settings ---------- */
function calcTargets() {
  const num = id => parseFloat($(id).value);
  const sex = $('#f-sex').value, age = num('#f-age'), h = num('#f-height'), w = num('#f-weight');
  const act = parseFloat($('#f-activity').value), surplus = parseFloat($('#f-surplus').value);
  const err = $('#calc-err');
  if (!(age > 0 && h > 0 && w > 0)) { err.textContent = 'Fill in age, height and weight first.'; err.hidden = false; return; }
  err.hidden = true;
  const bmr = 10 * w + 6.25 * h - 5 * age + (sex === 'female' ? -161 : 5);
  const kcal = Math.round((bmr * act + surplus) / 10) * 10;
  const protein = Math.round(w * 2);
  const fat = Math.round(kcal * 0.27 / 9);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  const fiber = Math.round(kcal / 1000 * 14);
  Object.entries({ kcal, protein, carbs, fat, fiber }).forEach(([k, v]) => $('#t-' + k).value = v);
  S.formDirty = true;
  toast(`Maintenance ≈ ${fmt(bmr * act)} kcal. Tap Save targets.`);
}
function saveTargets(ev) {
  ev.preventDefault();
  const n = id => { const v = parseFloat($(id).value); return isFinite(v) ? v : null; };
  const T = {};
  for (const k of ['kcal', 'protein', 'carbs', 'fat', 'fiber', 'added_sugar']) {
    const v = n('#t-' + k);
    if (v == null || v <= 0) { toast('Fill in every target'); return; }
    T[k] = Math.round(v);
  }
  S.profile = { sex: $('#f-sex').value, age: n('#f-age'), height: n('#f-height'), weight: n('#f-weight'),
    activity: parseFloat($('#f-activity').value), surplus: parseFloat($('#f-surplus').value), targets: T, updatedAt: new Date().toISOString() };
  persist();
  S.formDirty = false; toast('Targets saved'); S.view = 'today'; render(); window.scrollTo(0, 0);
}
function saveKey() {
  const v = ($('#key-in')?.value || '').trim();
  if (!v.startsWith('sk-ant-')) { $('#key-status').textContent = 'That doesn’t look like a Claude API key. It starts with sk-ant-.'; return; }
  lsSet(API_KEY, v); client = null;
  S.formDirty = false; render(); toast('Key saved');
}
async function testKey() {
  const st = $('#key-status'); st.textContent = 'Testing…';
  try {
    const c = await getClient();
    await c.models.retrieve(MODEL);
    st.textContent = 'Key works.';
  } catch (e) { st.textContent = apiErrCopy(e) || 'Test stopped.'; }
}
function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'plate-ledger', version: 1, exportedAt: new Date().toISOString(), days: S.days, profile: S.profile }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `plate-ledger-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importData(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d.days !== 'object') throw 0;
    S.days = { ...S.days, ...d.days };
    if (d.profile) S.profile = d.profile;
    persist(); S.formDirty = false; render();
    toast(`Restored ${Object.keys(d.days).length} days`);
  } catch { toast('That file isn’t a Plate Ledger backup.'); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) {
    if (S.view === 'settings' && tabBtn.dataset.tab !== 'settings') S.formDirty = false;
    S.view = tabBtn.dataset.tab; render(); window.scrollTo(0, 0); return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  const ed = S.ed;
  switch (act) {
    case 'open-editor': openEditor(null); break;
    case 'prev': S.date = addDays(S.date, -1); render(); break;
    case 'next': if (S.date < todayKey()) { S.date = addDays(S.date, 1); render(); } break;
    case 'goto': S.date = a.dataset.date; S.view = 'today'; render(); window.scrollTo(0, 0); break;
    case 'edit-meal': { const m = S.days[S.date]?.meals?.find(x => x.id === a.dataset.id); if (m) openEditor(m); break; }
    case 'review': runReview(); break;
    case 'stop-review': S.review.ctl?.abort(); break;
    case 'calc': calcTargets(); break;
    case 'save-key': saveKey(); break;
    case 'test-key': testKey(); break;
    case 'clear-key': try { localStorage.removeItem(API_KEY); } catch {} client = null; S.formDirty = false; render(); toast('Key removed'); break;
    case 'export': exportData(); break;
    case 'close': closeEditor(); break;
    case 'analyze': readEdFields(); analyze(); break;
    case 'stop-analyze': ed?.ctl?.abort(); break;
    case 'rm-photo': { readEdFields(); const i = +a.dataset.i; URL.revokeObjectURL(ed.urls[i]); ed.files.splice(i, 1); ed.urls.splice(i, 1);
      if (i === 0) { ed.thumb = null; if (ed.files[0]) makeThumb(ed.files[0]).then(t => { if (S.ed === ed) ed.thumb = t; }); }
      renderSheet(); break; }
    case 'rm-item': readEdFields(); ed.items.splice(+a.dataset.i, 1); renderSheet(); break;
    case 'add-item': readEdFields(); ed.items.push(withBase({ name: '', grams: 100, source: 'manual' })); renderSheet();
      setTimeout(() => $(`#it-${ed.items.length - 1}-name`)?.focus(), 0); break;
    case 'save': saveMeal(); break;
    case 'ask-del': readEdFields(); ed.confirmDel = true; renderSheet(); break;
    case 'cancel-del': ed.confirmDel = false; renderSheet(); break;
    case 'delete': deleteMeal(); break;
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'import-in' && t.files?.[0]) { importData(t.files[0]); return; }
  if (t.classList?.contains('photo-in') && S.ed) {
    const ed = S.ed; readEdFields();
    const picked = Array.from(t.files || []);
    if (!picked.length) return;
    const st = $('#ed-status'); if (st) st.textContent = 'Preparing photo…';
    for (const f of picked) {
      if (ed.files.length >= MAX_PHOTOS) { toast(`Up to ${MAX_PHOTOS} photos per meal`); break; }
      const jpg = await toJpeg(f);
      if (S.ed !== ed) return;
      ed.files.push(jpg); ed.urls.push(URL.createObjectURL(jpg));
    }
    if (!ed.thumb && ed.files[0]) ed.thumb = await makeThumb(ed.files[0]);
    if (S.ed === ed) { ed.status = ''; renderSheet(); }
    return;
  }
  const item = t.closest?.('.item');
  if (item && S.ed && t.dataset.f) {
    const it = S.ed.items[+item.dataset.i]; const f = t.dataset.f;
    if (f === 'grams') {
      const g = parseFloat(t.value) || 0; it.grams = g;
      if (it.base.grams > 0) {
        const ratio = g / it.base.grams;
        NUTRS.forEach(k => { if (it.base[k] === undefined) return; it[k] = r1(it.base[k] * ratio); const inp = item.querySelector(`[data-f="${k}"]`); if (inp) inp.value = it[k]; });
      } else { it.base.grams = g; }
    } else if (f !== 'name') {
      it[f] = parseFloat(t.value) || 0;
      it.base[f] = it.grams > 0 && it.base.grams > 0 ? it[f] * it.base.grams / it.grams : it[f];
    }
    updateSum();
  }
  if (t.closest?.('#stats-form')) S.formDirty = true;
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset?.f === 'name' && S.ed) { const item = t.closest('.item'); S.ed.items[+item.dataset.i].name = t.value; }
  if (t.closest?.('#stats-form')) S.formDirty = true;
});
document.addEventListener('submit', e => { if (e.target.id === 'stats-form') saveTargets(e); });

try { navigator.storage?.persist?.(); } catch {}
render();
</script>
</body>
</html>
